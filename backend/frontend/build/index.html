        fetch('/api/predictions/latest').then(function(r){return r.json();}).then(function(pArr){
          predictions_cache_ts=Date.now();

  function loadTrucks(){
    if(mapLoading)return; // Prevent overlapping requests
    mapLoading=true;
    
    fetch('/api/map/trucks').then(function(r){return r.json();}).then(function(res){
      var epoch=res.epoch||0;
      
      // Skip if epoch hasn't changed (no new data)
      if(epoch===lastEpoch&&trucks.length>0){
        mapLoading=false;
        idleCount++;
        if(idleCount>3&&pollInterval<15000){pollInterval=Math.min(15000,pollInterval+2000);schedulePoll();}
        return;
      }
      // Reset to fast polling when data changes
      if(idleCount>0){idleCount=0;if(pollInterval>5000){pollInterval=5000;schedulePoll();}}
      lastEpoch=epoch;
      
      var oldTrucks=trucks.slice();
      trucks=res.trucks||[];
      
      var np={};
      trucks.forEach(function(t){
        var id=t.ENTITY_ID;
        var failType=t.FAILURE_TYPE;
        var ttf=t.TTF_HOURS;
        if(id&&failType&&failType!=='NORMAL'&&failType!==null){
          var ttfNum=parseFloat(ttf);
          np[id]={type:failType,ttf:isNaN(ttfNum)?null:ttfNum};
        }
      });
      if(JSON.stringify(np)!==JSON.stringify(preds)){
        preds=np;lastPreds=JSON.parse(JSON.stringify(np));
        if(sel)updatePanel();
      }
      
      document.getElementById('map-info').textContent=trucks.length+' trucks | '+svcs.length+' svc'+(Object.keys(preds).length?' | '+Object.keys(preds).length+' alert':'');
      animateTrucks(oldTrucks,trucks);
      drawHL();
      if(sel&&preds[sel]){var t=trucks.find(function(x){return x.ENTITY_ID===sel;});if(t)loadRec(sel,preds[sel].ttf,t.LATITUDE,t.LONGITUDE);}
      if(sel)updatePanel();
      wireTableClicks();
      if(sel)highlightTableRow(sel);
      mapLoading=false;
    }).catch(function(){mapLoading=false;});
  }
  
  var lastRecPos={id:null,lat:0,lng:0},recLoading=false,recRequestId=0;
  function loadRec(id,ttf,lat,lng){
    // Always allow new requests when switching trucks - cancel stale requests via ID
    var thisRequestId=++recRequestId;
    var moved=lastRecPos.id!==id||Math.abs(lastRecPos.lat-lat)>0.05||Math.abs(lastRecPos.lng-lng)>0.05;
    if(!moved&&rec&&rec.entity_id===id)return; // Only skip if rec is for THIS truck
    lastRecPos={id:id,lat:lat,lng:lng};
    recLoading=true;
    
    // Load recommendation WITHOUT AI explanation (fast - AI is click-to-load)
    fetch('/api/map/service-recommendation/'+id+'?ttf_hours='+(ttf||6)+'&truck_lat='+lat+'&truck_lng='+lng)
    .then(function(r){return r.json();})
    .then(function(d){
      if(thisRequestId!==recRequestId)return;
      rec=d;rec.ai_loading=false;rec.ai_available=true;recLoading=false;drawSvcRoute();drawSvcs();updatePanel();
    })
    .catch(function(){if(thisRequestId===recRequestId)recLoading=false;});
  }

  function animateTrucks(oldT,newT){
    if(!oldT||!oldT.length||isAnimating){drawTrucks();return;}
    var oldMap={};
    oldT.forEach(function(t){oldMap[t.ENTITY_ID]={lng:t.LONGITUDE,lat:t.LATITUDE};});
    var hasMovement=false;
    newT.forEach(function(t){
      var prev=oldMap[t.ENTITY_ID];
      if(prev&&(Math.abs(prev.lng-t.LONGITUDE)>0.001||Math.abs(prev.lat-t.LATITUDE)>0.001))hasMovement=true;
    });
    if(!hasMovement){drawTrucks();return;}
    isAnimating=true;
    drawTrucks();
    var startTime=Date.now(),duration=1500;
    function frame(){
      var elapsed=Date.now()-startTime;
      var progress=Math.min(elapsed/duration,1);
      var eased=progress*(2-progress);
      newT.forEach(function(t){
        var prev=oldMap[t.ENTITY_ID];
        if(prev){
          var ix=prev.lng+(t.LONGITUDE-prev.lng)*eased;
          var iy=prev.lat+(t.LATITUDE-prev.lat)*eased;
          var el=document.querySelector('#trucks .truck-marker[data-id="'+t.ENTITY_ID+'"]');
          if(el)el.setAttribute('transform','translate('+(ix-t.LONGITUDE)+','+(iy-t.LATITUDE)+')');
        }
      });
      if(progress<1)animFrameId=requestAnimationFrame(frame);
      else{
        isAnimating=false;
        newT.forEach(function(t){
          var el=document.querySelector('#trucks .truck-marker[data-id="'+t.ENTITY_ID+'"]');
          if(el)el.removeAttribute('transform');
        });
      }
    }
    if(animFrameId)cancelAnimationFrame(animFrameId);
    frame();
  }

  // Haversine distance calculation (miles)
  function haversine(lat1,lon1,lat2,lon2){var R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
  
  function drawTrucks(){
    var g=document.getElementById('trucks');if(!g)return;
    var validTrucks=trucks.filter(function(t){return t.LATITUDE;});
    // Detect overlapping trucks (within 0.5 degrees) and calculate offsets
    var offsets={};
    var threshold=0.5; // degrees - roughly 30-50 miles
    var offsetDist=0.6; // offset distance for overlapping trucks
    validTrucks.forEach(function(t1,i){
      var group=[t1.ENTITY_ID];
      validTrucks.forEach(function(t2,j){
        if(i<j&&Math.abs(t1.LATITUDE-t2.LATITUDE)<threshold&&Math.abs(t1.LONGITUDE-t2.LONGITUDE)<threshold){
          group.push(t2.ENTITY_ID);
        }
      });
      if(group.length>1){
        // Calculate fan offset for each truck in the group
        group.forEach(function(id,idx){
          if(!offsets[id]){
            var angle=(idx/(group.length))*2*Math.PI-Math.PI/2;
            offsets[id]={dx:Math.cos(angle)*offsetDist,dy:Math.sin(angle)*offsetDist};
          }
        });
      }
    });
    g.innerHTML=validTrucks.map(function(t){
      var n=(t.ENTITY_ID||'').replace('TRUCK_0','').replace('TRUCK_','');
      var fail=preds[t.ENTITY_ID],isSel=t.ENTITY_ID===sel,r=isSel?0.45:0.35;
      var isBrokenDown=fail&&fail.ttf!==null&&fail.ttf<=0.5;
      var c=isBrokenDown?'#6b7280':(fail?'#dc2626':'#16a34a');
      // Apply offset if truck overlaps with another
      var off=offsets[t.ENTITY_ID]||{dx:0,dy:0};
      var px=t.LONGITUDE+off.dx,py=t.LATITUDE+off.dy;
      var svg='<g class="truck-marker" data-id="'+t.ENTITY_ID+'" data-lat="'+t.LATITUDE+'" data-lng="'+t.LONGITUDE+'">';
      // Draw connector line if offset
      if(off.dx!==0||off.dy!==0){
        svg+='<line x1="'+t.LONGITUDE+'" y1="'+t.LATITUDE+'" x2="'+px+'" y2="'+py+'" stroke="#666" stroke-width="0.04" stroke-dasharray="0.1,0.1"/>';
      }
      if(isSel)svg+='<circle cx="'+px+'" cy="'+py+'" r="'+(r+0.15)+'" fill="none" stroke="#1d4ed8" stroke-width="0.08"/>';
      if(isBrokenDown){
        // Broken down truck: gray X symbol
        svg+='<circle cx="'+px+'" cy="'+py+'" r="'+r+'" fill="#6b7280" stroke="#fff" stroke-width="0.05"/>';
        svg+='<path d="M'+(px-0.15)+','+(py-0.15)+'L'+(px+0.15)+','+(py+0.15)+'M'+(px+0.15)+','+(py-0.15)+'L'+(px-0.15)+','+(py+0.15)+'" stroke="#fff" stroke-width="0.08" stroke-linecap="round"/>';
      }else if(fail){
        // Failure predicted: red with pulsing ring
        svg+='<circle cx="'+px+'" cy="'+py+'" r="'+(r+0.1)+'" fill="none" stroke="#dc2626" stroke-width="0.05"><animate attributeName="r" from="'+r+'" to="'+(r+0.4)+'" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" from=".7" to="0" dur="1s" repeatCount="indefinite"/></circle>';
        svg+='<circle cx="'+px+'" cy="'+py+'" r="'+r+'" fill="'+c+'" stroke="#fff" stroke-width="0.05"/>';
        svg+='<text x="'+px+'" y="'+py+'" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="0.28" font-weight="bold" transform="scale(1,-1) translate(0,'+(py*-2)+')">'+n+'</text>';
      }else{
        // Normal truck: green
        svg+='<circle cx="'+px+'" cy="'+py+'" r="'+r+'" fill="'+c+'" stroke="#fff" stroke-width="0.05"/>';
        svg+='<text x="'+px+'" y="'+py+'" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="0.28" font-weight="bold" transform="scale(1,-1) translate(0,'+(py*-2)+')">'+n+'</text>';
      }
      svg+='</g>';
      return svg;
    }).join('');
    document.querySelectorAll('#trucks .truck-marker').forEach(function(el){el.onclick=function(e){e.stopPropagation();var id=el.dataset.id,lat=parseFloat(el.dataset.lat),lng=parseFloat(el.dataset.lng);if(sel===id){sel=null;rec=null;}else{sel=id;rec=null;if(preds[id])loadRec(id,preds[id].ttf,lat,lng);}drawTrucks();drawHL();drawSvcRoute();drawSvcs();updatePanel();highlightTableRow(sel);renderFleetTable();};});
  }
  
  function drawHL(){
    var g=document.getElementById('highlight');if(!g)return;
    if(!sel){g.innerHTML='';return;}
    var rt=routes[sel];if(!rt||!rt.geometry){g.innerHTML='';return;}
    var t=trucks.find(function(x){return x.ENTITY_ID===sel;});
    var c=rt.geometry.coordinates.slice(); // Copy to avoid mutating original
    if(!c.length){g.innerHTML='';return;}
    
    // Check if truck is on return trip - if so, reverse the route
    var isReturn = t && t.IS_RETURN_TRIP;
    if(isReturn) c = c.slice().reverse();
    
    // Find closest point on route to truck (split traveled vs remaining)
    var truckIdx=0;
    if(t){
      var minD=Infinity;
      for(var i=0;i<c.length;i++){
        var d=Math.sqrt(Math.pow(c[i][0]-t.LONGITUDE,2)+Math.pow(c[i][1]-t.LATITUDE,2));
        if(d<minD){minD=d;truckIdx=i;}
      }
    }
    
    // Traveled route (solid dark blue, thicker)
    var traveled=c.slice(0,truckIdx+1);
    var traveledPath=traveled.length>1?'<path d="'+linePath(traveled)+'" fill="none" stroke="#1e40af" stroke-width="0.4" stroke-linecap="round"/>':'';
    
    // Remaining route (dotted yellow/orange for visibility, bigger gaps)  
    var remaining=c.slice(truckIdx);
    var remainingPath=remaining.length>1?'<path d="'+linePath(remaining)+'" fill="none" stroke="#f59e0b" stroke-width="0.25" stroke-dasharray="0.5,0.5" stroke-linecap="round"/>':'';
    
    // Origin/Destination cities - swap if on return trip (backend already provides swapped cities)
    var originCity = t ? t.START_CITY : (rt.start_city||'START');
    var destCity = t ? t.END_CITY : (rt.end_city||'END');
    
    // Origin marker at start of route (first point of oriented coords)
    var ox=c[0][0],oy=c[0][1];
    var origin='<g>'+
      '<polygon points="'+(ox)+','+(oy+0.6)+' '+(ox+0.4)+','+oy+' '+ox+','+(oy-0.6)+' '+(ox-0.4)+','+oy+'" fill="#22c55e" stroke="#fff" stroke-width="0.08"/>'+
      '<text x="'+ox+'" y="'+(oy-0.9)+'" text-anchor="middle" fill="#166534" font-size="0.4" font-weight="bold" transform="scale(1,-1) translate(0,'+((oy-0.9)*-2)+')">▶ '+originCity+'</text>'+
      '</g>';
    
    // Destination marker at end of route (last point of oriented coords)
    var dx=c[c.length-1][0],dy=c[c.length-1][1];
    var dest='<g>'+
      '<polygon points="'+(dx)+','+(dy+0.6)+' '+(dx+0.15)+','+(dy+0.15)+' '+(dx+0.5)+','+(dy+0.15)+' '+(dx+0.2)+','+(dy-0.1)+' '+(dx+0.35)+','+(dy-0.55)+' '+dx+','+(dy-0.25)+' '+(dx-0.35)+','+(dy-0.55)+' '+(dx-0.2)+','+(dy-0.1)+' '+(dx-0.5)+','+(dy+0.15)+' '+(dx-0.15)+','+(dy+0.15)+'" fill="#7c3aed" stroke="#fff" stroke-width="0.06"/>'+
      '<text x="'+dx+'" y="'+(dy-0.85)+'" text-anchor="middle" fill="#5b21b6" font-size="0.4" font-weight="bold" transform="scale(1,-1) translate(0,'+((dy-0.85)*-2)+')">🏁 '+destCity+'</text>'+
      '</g>';
    
    g.innerHTML=traveledPath+remainingPath+origin+dest;
    if(t&&(t.TRIP_PHASE==='ARRIVING'||t.TRIP_PHASE==='JUST_TURNED')){
      var turnPt=t.TRIP_PHASE==='ARRIVING'?[dx,dy]:[ox,oy];

  function drawSvcRoute(){
    var g=document.getElementById('service-route');if(!g)return;
    var opt=rec&&(rec.optimal||rec.recommended);
    if(!sel||!opt||rec.entity_id!==sel){g.innerHTML='';return;}
    var t=trucks.find(function(x){return x.ENTITY_ID===sel;});if(!t){g.innerHTML='';return;}
    var svc=opt;
    var svcPos=[svc.lng||svc.longitude,svc.lat||svc.latitude];
    var html='';

    function buildPath(coords,maxPts){
      var step=Math.max(1,Math.floor(coords.length/maxPts));
      var pc=[];
      for(var i=0;i<coords.length;i+=step)pc.push(coords[i]);
      pc.push(coords[coords.length-1]);
      return 'M'+pc.map(function(p){return p[0]+','+p[1];}).join('L');
    }

    function trimFromTruck(coords){
      if(!coords||coords.length<2)return coords;
      var tLng=t.LONGITUDE,tLat=t.LATITUDE;
      var d0=(coords[0][0]-tLng)*(coords[0][0]-tLng)+(coords[0][1]-tLat)*(coords[0][1]-tLat);
      if(d0<0.01)return coords;
      var minD=Infinity,minIdx=0;
      for(var i=0;i<coords.length;i++){
        var d=(coords[i][0]-tLng)*(coords[i][0]-tLng)+(coords[i][1]-tLat)*(coords[i][1]-tLat);
        if(d<minD){minD=d;minIdx=i;}
      }
      coords=coords.slice(minIdx);
      coords.unshift([tLng,tLat]);
      return coords;
    }

    if(svc.route_geometry&&svc.route_geometry.coordinates&&svc.route_geometry.coordinates.length>1){
      var coords=svc.route_geometry.coordinates.slice();
      coords=trimFromTruck(coords);
      html+='<path class="service-route" d="'+buildPath(coords,200)+'" stroke-dasharray="0.4,0.3"/>';
    }else{
      html+='<path class="service-route" d="'+curve([t.LONGITUDE,t.LATITUDE],svcPos)+'" stroke-dasharray="0.4,0.3"/>';
    }

    if(svc.reconnect_geometry&&svc.reconnect_geometry.coordinates&&svc.reconnect_geometry.coordinates.length>1){
      var rc=svc.reconnect_geometry.coordinates.slice();
      html+='<path class="service-route" d="'+buildPath(rc,200)+'" stroke="red" stroke-width="0.15" stroke-dasharray="none" fill="none" opacity="0.8"/>';
    }else if(svc.reconnect_node&&svc.reconnect_path&&svc.reconnect_path.length>1){
      var nodes=window._freightNodes||{};
      var pts=[];
      for(var i=0;i<svc.reconnect_path.length;i++){
        var n=nodes[svc.reconnect_path[i]];
        if(n)pts.push([n[0],n[1]]);
      }
      if(pts.length>1){
        html+='<path class="service-route" d="'+buildPath(pts,200)+'" stroke="red" stroke-width="0.15" stroke-dasharray="none" fill="none" opacity="0.8"/>';
      }
    }

    g.innerHTML=html;
  }

  function addDarkToggle(){
    if(document.getElementById('dark-toggle'))return;
    var btn=document.createElement('button');
    btn.id='dark-toggle';
    btn.textContent='\u263E';
    btn.title='Toggle dark theme';
    btn.style.cssText='background:#1e40af;color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2);';
    btn.onclick=function(){
      document.body.classList.toggle('dark-theme');
      btn.textContent=document.body.classList.contains('dark-theme')?'\u2600':'\u263E';
      try{localStorage.setItem('ftfp-dark',document.body.classList.contains('dark-theme')?'1':'0');}catch(e){}
      applyDarkOverrides();
    };
    placeAboveSimTime(btn);
    try{if(localStorage.getItem('ftfp-dark')==='1'){document.body.classList.add('dark-theme');btn.textContent='\u2600';applyDarkOverrides();}}catch(e){}
  }
  function applyDarkOverrides(){
    if(!document.body.classList.contains('dark-theme'))return;
    var all=document.querySelectorAll('#root div,#root aside,#root section,#root main');
    all.forEach(function(el){
      var bg=getComputedStyle(el).backgroundColor;
      if(bg==='rgb(255, 255, 255)'||bg==='rgba(255, 255, 255, 1)'){el.style.backgroundColor='var(--card-bg)';}
      var s=el.style;
      if(s.background&&(s.background.indexOf('#fff')>=0||s.background.indexOf('white')>=0)){s.background='var(--card-bg)';}
    });
  }
  function place(){var m=document.getElementById('map-box');if(!m)return false;var t=document.querySelectorAll('#root table');if(t.length<2)return false;var p=t[0].parentElement;while(p&&p.id!=='root'){if(getComputedStyle(p).display==='grid'||getComputedStyle(p).display==='flex'){p.parentElement.insertBefore(m,p);m.style.display='block';init();return true;}p=p.parentElement;}return false;}
  var n=0,iv=setInterval(function(){n++;if(place()||n>100)clearInterval(iv);},100);
})();
